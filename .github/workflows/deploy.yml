name: CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# All shell steps will run inside the app folder
defaults:
  run:
    working-directory: projects/churn_api

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -la
          echo "---- repo root ----"
          ls -la $GITHUB_WORKSPACE
          echo "---- app dir ----"
          ls -la app || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Smoke test: import your FastAPI module from the app dir
      - name: Smoke test import
        run: python -c "import importlib; importlib.import_module('app.main'); print('Imported app.main OK')"

      - name: Build Docker image (app subdir as build context)
        run: docker build -t churn-api:ci .

      # Trigger Render deploy (works regardless of working-directory)
      - name: Trigger Render deploy (if hook is set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Triggering Render deploy..."
            curl -fsSL -X POST "$HOOK" && echo "Render deploy triggered."
          else
            echo "No RENDER_DEPLOY_HOOK secret set; skipping deploy."
          fi
