name: CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Simple smoke test: verify the app module imports
      - name: Smoke test import
        run: python -c "import importlib; importlib.import_module('app.main'); print('Imported app.main OK')"

      - name: Build Docker image
        run: docker build -t churn-api:ci .

      # Always run, but guard on the secret inside the script
      - name: Trigger Render deploy (if hook is set)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Triggering Render deploy..."
            curl -fsSL -X POST "$HOOK" && echo "Render deploy triggered."
          else
            echo "No RENDER_DEPLOY_HOOK secret set; skipping deploy."
          fi
# Just want to check